openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transfers
    description: Temporary QR-paired file transfers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /easydrop/sessions:
    post:
      operationId: createTransferSession
      tags: [transfers]
      summary: Create a temporary EasyDrop transfer session
      description: Creates short-lived pairing credentials and stores only file metadata. File bytes are sent peer-to-peer over WebRTC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferSessionInput"
      responses:
        "201":
          description: Temporary transfer session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferSession"
        "400":
          description: Invalid file metadata
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TransferFileMetadata:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          maxLength: 127
        size:
          type: integer
          minimum: 0
          maximum: 262144000
      required: [name, mimeType, size]
    TransferSessionInput:
      type: object
      additionalProperties: false
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/TransferFileMetadata"
      required: [files]
    TransferSession:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
        senderToken:
          type: string
        receiverToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: "#/components/schemas/TransferFileMetadata"
      required: [sessionId, senderToken, receiverToken, expiresAt, files]

